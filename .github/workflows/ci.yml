# Continuous integration: lint, type-check, test and build on every push to
# master and on every pull request (including Dependabot's).
#
# Publishing to npm is a separate workflow (publish.yml) triggered by version tags.

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check tests
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
